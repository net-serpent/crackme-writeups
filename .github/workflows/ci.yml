name: solvers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: byte-compile everything
        run: python -m compileall -q tools writeups

      - name: run the self-contained solvers
        run: python tools/ci_check.py -v
